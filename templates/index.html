<!DOCTYPE html>
<html>
<head>


  <style>
      
    body, html {
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .button:hover {
      opacity: 0.7; 
    }

    .popup-menu {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 120px;
        box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        padding: 10px;
        z-index: 1;
    }

    .popup-menu a {
        display: block;
        padding: 8px 12px;
        text-decoration: none;
        color: #333;
    }

    .popup-menu a:hover {
        background-color: #ddd; 
    }

    .button-container {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
    } 

.toast-panel {
    position: fixed;
    bottom: 125px;
    left: 90px;
    width: 490px; /* Adjust as needed */
    height: 380px; /* Adjust as needed */
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    padding: 20px;
    z-index: 3;
}

.toast-message {
    color: white;
    font-size: 24px;
    margin-bottom: 20px;
}

.toast-buttons {
    display: flex;
    flex-wrap: wrap; /* Enable wrapping */
    max-width: 480px; 
}

.toast-button {
    margin-right: 10px;
    margin-bottom: 10px; /* Add margin between rows */
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.toast-button:last-child {
    margin-right: 0;
}

#decisionTree {
    /* border: 2px solid black; */
    padding: 10px; 
    height: 550px;
    width: 720px;
  }

.level-container {
    /* border: 1px solid gray; */
    
    height: 137.5px;
    width: 720px;
    display: flex; /* Use flexbox layout */
    flex-direction: row; /* Stack items horizontally */
    align-items: center; /* Center items vertically */
    /*justify-content: center; /* Center items horizontally */ 
    justify-content: space-around; /* Distribute items evenly with space between */

}

.textbox {
    margin: 5px; 
    border: 1px solid darkgreen;
    width: 80px;
    height: 80px;
    display: flex; 
    justify-content: center; 
    align-items: center; 
}
.yesBranch {
  margin: 5px; 
  /*border: 1px solid black; */
  width: 0px;
  display: flex; 
  justify-content: center; 
  align-items: center; 
  transform: rotate(-45deg); /* Apply rotation */

}
.noBranch {
  margin: 5px; 
  /*border: 1px solid black; */
  width: 0px;
  display: flex; 
  justify-content: center; 
  align-items: center; 
  transform: rotate(45deg); /* Apply rotation */
}

.glowing-textbox {
    transition: box-shadow 0.5s ease-in-out; /* Smooth transition for box-shadow */
}


.text-inside { /* text inside decision node */
    position: absolute; /* Position the text absolutely */
    top: 50%; /* Center vertically */
    left: 50%; /* Center horizontally */
    transform: translate(-50%, -50%) rotate(-45deg); /* Rotate and center the text */
    transform-origin: center; /* Rotate around the center of the text */
}

  </style>
</head>
<body>
